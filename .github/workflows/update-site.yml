# Pulls the latest results from ESPN, rebuilds the site data and publishes to GitHub Pages.
# Runs every Tuesday morning, on every push to main, and on demand from the Actions tab.
name: Update and publish site

on:
  schedule:
    - cron: "0 12 * * 2"   # Tuesdays 12:00 UTC (7 a.m. Central)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch the current season from ESPN
        # Past seasons are committed in data/raw; only the live season needs refreshing.
        if: github.event_name != 'push'
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/fetch_espn.py "$(python -c 'from datetime import date; d=date.today(); print(d.year if d.month>=8 else d.year-1)')"

      - name: Build site data
        run: python scripts/build_data.py

      - name: Save the refreshed ESPN data
        if: github.event_name != 'push'
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add data/raw site/data
          git diff --cached --quiet || git commit -m "Weekly ESPN update $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
